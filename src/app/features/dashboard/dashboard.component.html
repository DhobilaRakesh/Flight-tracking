@if (vm$ | async; as vm) {
  <div class="shell">
    <app-dashboard-header
      [now$]="now$"
      [theme]="vm.theme"
      [playing]="vm.playing"
      [sidebarOpen]="sidebarOpen"
      (themeToggle)="toggleTheme()"
      (menuToggle)="sidebarOpen = !sidebarOpen"
    >
      <app-playback-controls
        [playing]="vm.playing"
        [speed]="vm.speed"
        (toggle)="togglePlayback()"
        (restart)="restart()"
        (speedChange)="setSpeed($event)"
      />
    </app-dashboard-header>

    <main id="main" class="layout" tabindex="-1">
      <section class="kpis" aria-label="Operations summary">
        <app-kpi-card label="Total flights" [value]="vm.kpis.total" [hint]="vm.kpis.scheduled + ' scheduled'">
          <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
        </app-kpi-card>
        <app-kpi-card label="Active flights" tone="active" [value]="vm.kpis.active" hint="In the air">
          <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </app-kpi-card>
        <app-kpi-card label="Delayed flights" tone="delayed" [value]="vm.kpis.delayed" hint="Needs attention">
          <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </app-kpi-card>
        <app-kpi-card label="Arrived flights" tone="arrived" [value]="vm.kpis.arrived" hint="Completed">
          <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </app-kpi-card>
      </section>

      <aside id="sidebar" class="sidebar" [class.open]="sidebarOpen" aria-label="Flight search and list">
        <div class="sidebar-head">
          <app-flight-filters
            [origins]="vm.origins"
            [destinations]="vm.destinations"
            [resultCount]="vm.visible.length"
            [totalCount]="vm.all.length"
            [value]="vm.filters"
            (filtersChange)="onFilters($event)"
          />
        </div>
        <div class="sidebar-list">
          @if (vm.loading) {
            <div class="skeleton" aria-busy="true" aria-label="Loading flights">
              @for (n of [1, 2, 3, 4, 5, 6]; track n) {
                <div class="sk"></div>
              }
            </div>
          } @else if (vm.error) {
            <div class="error" role="alert">
              <p>{{ vm.error }}</p>
              <button type="button" (click)="retry()">Retry</button>
            </div>
          } @else {
            <app-flight-list [flights]="vm.visible" [selectedId]="vm.selectedId" (flightSelected)="onSelect($event)" />
          }
        </div>
      </aside>

      @if (sidebarOpen) {
        <button type="button" class="scrim" aria-label="Close flights panel" (click)="sidebarOpen = false"></button>
      }

      <section class="map-area" aria-label="Flight map">
        <app-flight-map
          [flights]="vm.visible"
          [selected]="vm.selected"
          [airports]="vm.airports"
          [theme]="vm.theme"
          [following]="vm.playing"
          (flightSelected)="onSelect($event)"
        />
      </section>

      @if (vm.selected; as sel) {
        <aside class="details" aria-label="Selected flight details">
          <app-flight-details [flight]="sel" (closed)="onSelect(null)" />
        </aside>
      }
    </main>
  </div>
}
